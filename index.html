<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tree Survey</title>
<style>
:root{--g:#2e7d32;--bg:#fff;--fg:#1b1b1b;--bd:#ccc}
@media(prefers-color-scheme:dark){:root{--bg:#161a16;--fg:#eee;--bd:#555}}
body{font:16px system-ui,sans-serif;margin:auto;padding:12px;max-width:520px;background:var(--bg);color:var(--fg)}
label{display:block;margin:14px 0 4px;font-weight:600}
input,select,textarea,button{width:100%;box-sizing:border-box;font:inherit;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg)}
button{background:var(--g);color:#fff;border:0;margin-top:18px;padding:14px;font-weight:600}
#gps{padding:10px;border-radius:8px;border:2px solid var(--bd)}
#gps.ok{border-color:var(--g)}#gps.bad{border-color:#c62828}
.row label{display:inline;font-weight:400}.row input{width:auto}.hide{display:none}
</style></head><body>
<h2>🌳 Tree Survey</h2><div id="area" style="font-weight:600;color:var(--g)">Area: …</div>
<label>Surveyor name</label><input id="who">
<label>1. Location</label><div id="gps">Waiting for GPS…</div>
<label>Street</label><select id="street"></select>
<label>Adjacent site number</label><input id="site" type="number" inputmode="numeric" min="0">
<label>2. Tree type</label><select id="sp"></select>
<div id="oth" class="hide"><label>Name / description</label><textarea id="otxt" rows="2" placeholder="Another name, or describe leaves/flowers/fruit"></textarea></div>
<label>3. Photo</label><input id="ph" type="file" accept="image/*" capture="environment">
<label>4. Condition (optional)</label>
<div class="row"><input type="radio" name="c" value="Healthy" id="h"><label for="h">Healthy</label> &nbsp; <input type="radio" name="c" value="Not good" id="n"><label for="n">Not good</label></div>
<textarea id="note" rows="2" placeholder="Observations: termites, chopped, under electric wires…" style="margin-top:8px"></textarea>
<button id="go">Submit</button><p id="msg"></p>
<script src="config.js"></script><script>
const $=id=>document.getElementById(id),msg=t=>$("msg").textContent=t;
let best=null,photo="",T=[],queue=JSON.parse(localStorage.q||"[]");
const save=()=>{try{localStorage.q=JSON.stringify(queue)}catch(e){}};
fetch("tree_reference.csv").then(r=>r.text()).then(t=>{T=parseCSV(t);$("sp").innerHTML='<option value="">— select —</option>'+T.map((r,i)=>`<option value="${i}">${r[0]} (${r[2]})</option>`).join("")+'<option value="other">Other / not sure</option>'});
fetch("streets.csv").then(r=>r.text()).then(t=>{$("street").innerHTML='<option value="">— select —</option>'+parseCSV(t).map(r=>`<option>${r[0]}</option>`).join("")});
$("sp").onchange=()=>$("oth").className=$("sp").value=="other"?"":"hide";
function show(){const g=$("gps");if(!best){g.textContent="Waiting for GPS…";g.className="";return}
 const ok=best.acc<=CONFIG.MAX_ACCURACY_M;g.className=ok?"ok":"bad";
 g.textContent=`±${Math.round(best.acc)} m  (${best.lat.toFixed(6)}, ${best.lng.toFixed(6)})`+(ok?" ✓ good":" – wait a few seconds / move away from buildings")}
navigator.geolocation.watchPosition(p=>{const a=p.coords.accuracy;if(!best||a<best.acc)best={lat:p.coords.latitude,lng:p.coords.longitude,acc:a};show()},e=>$("gps").textContent="GPS error: "+e.message+" (allow location access)",{enableHighAccuracy:true,maximumAge:0,timeout:30000});
$("ph").onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);photo=c.toDataURL("image/jpeg",.7)};im.src=URL.createObjectURL(f)};
$("go").onclick=()=>{
 const sp=$("sp").value;
 if(!best)return msg("No GPS fix yet");
 if(!$("street").value||$("site").value==="")return msg("Select street and enter site number");
 if(!sp)return msg("Select tree type");
 if(sp=="other"&&!$("otxt").value.trim())return msg("Please describe the tree");
 if(best.acc>CONFIG.MAX_ACCURACY_M&&!confirm(`GPS accuracy is only ±${Math.round(best.acc)} m. Submit anyway?`))return;
 const t=sp=="other"?["Other","",""]:T[sp];
 queue.push({id:Date.now()+"-"+Math.random().toString(36).slice(2,6),time:new Date().toISOString(),surveyor:$("who").value,lat:best.lat,lng:best.lng,accuracy:Math.round(best.acc),street:$("street").value,site:$("site").value,english:t[0],scientific:t[1],kannada:t[2],other:$("otxt").value,condition:(document.querySelector("input[name=c]:checked")||{}).value||"",notes:$("note").value,photo});
 save();
 ["site","otxt","note","ph"].forEach(i=>$(i).value="");$("sp").value="";$("oth").className="hide";document.querySelectorAll("input[name=c]").forEach(r=>r.checked=false);
 photo="";best=null;show();flush()};
async function flush(){while(queue.length){try{await fetch(CONFIG.SCRIPT_URL,{method:"POST",mode:"no-cors",body:JSON.stringify(queue[0])});queue.shift();save()}catch(e){return msg(`Saved on phone (${queue.length} pending) – will retry when online`)}}msg("✓ Submitted. Move to the next tree.")}
fetch(CONFIG.SCRIPT_URL+"?info=1").then(r=>r.json()).then(j=>$("area").textContent="Area: "+j.area).catch(()=>$("area").textContent="Area: (not reachable)");
addEventListener("online",flush);if(queue.length)flush();
</script></body></html>
